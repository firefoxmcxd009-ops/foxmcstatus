<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxmckingdom Store</title>
    <link rel="stylesheet" href="/Server/Store/Payment/style.css">
</head>
<body>

<div class="app">
    <div class="header">
        <h2>Kingdom Store</h2>
        <p>Select Rank & Complete Payment</p>
    </div>

    <div class="card">
        <form id="paymentForm" onsubmit="return false;">

            <div class="form">
                <input 
                    type="text" 
                    id="username"
                    placeholder="Minecraft Username" 
                    required
                >

                <label for="fileUpload" class="upload-btn">
                    <p class="filetext">Upload</p>
                    <p class="filetxt" id="filetxt">Upload invoice</p>
                </label>

                <input 
                    type="file" 
                    id="fileUpload" 
                    name="receipt"
                    accept="image/*"
                    hidden
                    required
                >
            </div>

            <label for="rank">Select Rank</label>
            <select id="rank" required>
                <option value="">Choose Rank</option>
                <option value="vip">VIP - $2</option>
                <option value="mvp">MVP - $3.5</option>
                <option value="mvpplus">MVP+ - $5</option>
                <option value="epic">EPIC - $6.5</option>
                <option value="kingdom">KINGDOM - $8</option>
            </select>

            <p class="errorsl" id="rankError">Please select a rank!</p>

            <div class="button">
                <button type="button" onclick="generateQR()">Create QR</button>
                <button type="button" onclick="sendOrder()">Submit</button>
            </div>

            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p>Loading QR...</p>
            </div>

            <div id="qr-container" class="hidden">
                <img id="qr-img" src="" alt="QR Code">
            </div>

        </form>
    </div>
</div>

<script src="/Server/Store/Payment/script.js"></script>
</body>
</html>
